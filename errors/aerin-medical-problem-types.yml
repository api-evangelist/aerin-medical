format: wordpress-rest
rfc9457: false
envelope:
  media_type: application/json
  fields:
  - name: code
    type: string
    description: Machine-readable error slug.
  - name: message
    type: string
    description: Human-readable message.
  - name: data.status
    type: integer
    description: HTTP status code, repeated in the body.
  note: >-
    This is the stock WordPress REST error envelope, not RFC 9457 problem+json. There is no
    `type` URI, no `instance`, no error documentation page, and no published error reference —
    the catalogue below is what was observed live, not what Aerin Medical documents.
problems:
- status: 401
  code: itsec_rest_api_access_restricted
  title: REST API access restricted
  detail: >-
    "You do not have sufficient permission to access this endpoint. Access to REST API
    requests is restricted." Emitted by the iThemes Security plugin, not by WordPress core.
  cause: The site restricts anonymous access to standard wp/v2 content collections.
  remediation: >-
    Not remediable by a public caller — no public credential exists. Use `searchSite` or the
    locator routes, which are open.
  observed_on:
  - /wp/v2/posts
  - /wp/v2/pages
  - /wp/v2/media
  - /wp/v2/categories
  - /wp/v2/tags
  - /wp/v2/users
  - /wp/v2/comments
  - /wp/v2/types
  - /wp/v2/taxonomies
  - /wp/v2/statuses
  - /wp/v2/blocks
  - /wp/v2/navigation
- status: 401
  code: rest_forbidden
  title: Not allowed
  detail: '"Sorry, you are not allowed to do that."'
  cause: WordPress core capability check failed for an anonymous caller.
  remediation: Administrative route; no public access path.
  observed_on:
