non_errors:
  note: >-
    Two behaviours that look like errors but are not — recorded so a client does not treat
    them as failures.
  cases:
  - condition: page beyond the last page of a collection
    behaviour: 'HTTP 200 with an empty JSON array and `X-WP-Total: 0` (observed at
      /em-locator/v1/locations?page=999).'
  - condition: unrecognised query parameter on the locator
    behaviour: >-
      Silently ignored — the full unfiltered collection is returned with `X-WP-Total: 1012`.
      A typo in a filter name therefore fails open rather than erroring.
