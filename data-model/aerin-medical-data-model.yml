summary: >-
  A small content-and-directory model. The one substantive entity is Location — a treating
  ENT practice — related to the Product and Designation taxonomies that drive the doctor
  finder. Physician and Alert exist as declared custom post types (they appear in the
  wp/v2/search `subtype` enumeration) but their collections are 401-gated, so their fields
  could not be observed.
entities:
- name: Location
  description: An ENT practice location trained on Aerin procedures, as listed at
    https://aerinmedical.com/find-ent-doctor/.
  post_type: location
  identifier: ID (WordPress post ID)
  slug_field: post.post_name
  public_url: permalink (https://aerinmedical.com/location/{slug}/)
  count_observed: 1012
  source_operation: openapi/aerin-medical-site-openapi.yml#listTreatingLocations
  fields:
  - {name: ID, type: integer, role: identifier}
  - {name: post.post_title, type: string, role: display name (practice or physician name)}
  - {name: address, type: string}
  - {name: formatted_address, type: string, note: geocoded display form}
  - {name: lat, type: string}
  - {name: lng, type: string}
  - {name: distance, type: number|boolean, note: populated only in proximity mode}
  - {name: phone, type: string}
  - {name: email, type: string, note: observed empty on all sampled records}
  - {name: website, type: string, note: observed empty on all sampled records}
  - {name: permalink, type: uri}
  - {name: list_item_html, type: string, role: presentation}
  - {name: map_item_html, type: string, role: presentation}
  - {name: map_details_html, type: string, role: presentation}
  embedded_attributes:
    source: post.post_content (a JSON string, not structured JSON fields)
    fields: [address, address2, city, state, zip, country, phone, business_name, rhinaer,
      vivaer, inoffice, excellence]
    note: >-
      The product flags (`rhinaer`, `vivaer`, `inoffice`, `excellence`) are string "0"/"1"
      values inside a serialized JSON string, so a consumer must parse a string to filter on
      them client-side. Internal CRM fields are also present in this blob — see
      security/aerin-medical-domain-security.yml, exposures[].
