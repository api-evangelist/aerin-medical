relationships:
- {from: Location, to: Product, type: has_many, via: product term (embedded rhinaer/vivaer
    flags in post.post_content)}
- {from: Location, to: Designation, type: has_one, via: designation term (em_designation)}
- {from: Location, to: Physician, type: has_many, via: rendered in list_item_html; no
    structured link exposed}
- {from: Location, to: Location, type: belongs_to, via: post.post_parent, note: every sampled
