gaps:
- Product membership is only retrievable per-location by parsing a JSON string, or per-query
  by filtering with an undocumented term ID.
- No structured physician entity, despite physician names being rendered into HTML.
- No `updated`/`etag` on the collection, so a consumer has no cheap way to detect change.
