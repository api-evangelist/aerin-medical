x-enrichment:
  date: '2026-07-31'
  status: enriched
  artifacts_added: 15
  pass: local-v1
  notes: >-
    No product API. Contract discovery probed aerinmedical.com, vivaer.com and rhinaer.com for
    OpenAPI on the host root, GraphQL, MCP tools/list, A2A agent cards at both the canonical
    and legacy well-known paths, and the full /.well-known/ set — every one 404. The one real
    machine-readable contract is the site's anonymous WordPress REST API at
    https://aerinmedical.com/wp-json (15 namespaces, 321 routes), whose access posture is
    inverted: the standard wp/v2 content collections are 401-blocked by iThemes Security while
    the company's own em-locator/v1 doctor finder is wide open with CORS *, returning 1,012
    treating ENT locations. An OpenAPI 3.1 with 15 verified anonymous operations was derived
    from that route index plus direct probing; the seven aerin-namespace POST form routes are
    listed without request bodies because they declare no args and have side effects, so they
    were not invoked. Searched and found a real Coordinated Vulnerability Disclosure Policy
    (security@aerinmedical.com, 5-business-day SLA, safe harbour) and a published corporate
    compliance programme. The locator endpoint was observed over-returning a Maps API key and
    internal CRM fields; recorded as an exposure without reproducing the values. No packages,
    MCP server, agent card, OAuth scopes, sandbox, CLI, changelog, webhooks or trust center
    exist; those artifacts were deliberately not written rather than stubbed. No idempotency
    contract exists, so no Idempotency pointer was emitted.
