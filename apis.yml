apis:
- name: Aerin Medical Site API (WordPress REST)
  description: 'Anonymously readable REST surface served by aerinmedical.com at /wp-json — 321
    routes across 15 namespaces. The substantive part is Aerin Medical''s own doctor-finder
    plugin (em-locator/v1): 1,012 ENT practice locations trained on VivAer or RhinAer, each
    with name, formatted address, phone, latitude/longitude and a public permalink, filterable
    by free text, by lat/lng proximity, by product (RhinAer 783 locations, VivAer 920) and by
    Center of Excellence designation (60 locations). Site search (wp/v2/search, 2,242 items),
    oEmbed and the route-discovery documents also answer anonymously, while every standard
    wp/v2 content collection returns 401. This is an incidental site surface, not an API
    product: Aerin Medical publishes no documentation, keys, SDKs, support channel, rate-limit
    policy, status page or terms of use for it.'
  humanURL: https://aerinmedical.com/find-ent-doctor/
