aid: aerin-medical
name: Aerin Medical
description: 'Aerin Medical, Inc. is a privately held medical-device company at 2565 Leghorn
  Street, Mountain View, California, with a Singapore entity at 60 Albert Street. It develops
  temperature-controlled radiofrequency devices that let ear, nose and throat physicians treat
  chronic nasal conditions in the office under local anesthetic, without incisions: the VivAer
  Stylus for nasal airway obstruction and the RhinAer Stylus for chronic rhinitis, both
  FDA-cleared and delivered through the Aerin Console. More than 200,000 patients have been
  treated as of March 2026. Aerin Medical operates no developer API programme — no portal, no
  documentation, no keys, no SDKs, no MCP server, no agent card and no status page. Its
  corporate site does serve an anonymously readable WordPress REST API, and one namespace of it
  is a genuinely useful first-party dataset: the doctor finder behind
  aerinmedical.com/find-ent-doctor/, which returns 1,012 treating ENT locations with
  coordinates and supports free-text, proximity, product and Center of Excellence filters. The
  company also publishes a real Coordinated Vulnerability Disclosure Policy for the Aerin
  Console, though it is not advertised at /.well-known/security.txt.'
